<!-- CURATED EXEMPLAR — archetype: metrics. Distilled from apa-landing.html #proof. Match the rhythm/discipline; do NOT clone. -->
<section id="metrics" class="cr-band-warm cr-section" aria-label="Proof in numbers">
  <style>
    /* doc-scoped: stat-grid layout + breakpoints ONLY — type / numerals /
       cards / surfaces all come from the house sheet (colors_and_type.css). */
    #metrics .mt-grid { display: grid; grid-template-columns: repeat(4, 1fr);
      gap: var(--cr-space-6); margin-top: var(--cr-space-15); }
    #metrics .mt-tile { display: flex; flex-direction: column; gap: var(--cr-space-3);
      min-height: 196px; }
    /* accent lives in the dot — the numeral stays dark + legible */
    #metrics .mt-num { margin: auto 0 0; }
    /* motion — transform-only entrance (resting opacity stays 1 → readable without JS / in preview) */
    #metrics .mt-reveal { animation: mtRise .6s cubic-bezier(.16,1,.3,1) both; animation-delay: var(--d, 0s); }
    @keyframes mtRise { from { transform: translateY(14px); } to { transform: none; } }
    @media (prefers-reduced-motion: reduce) { #metrics .mt-reveal { animation: none; } }
    @media (max-width: 900px) { #metrics .mt-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 560px) { #metrics .mt-grid { grid-template-columns: 1fr; } #metrics .mt-tile { min-height: auto; } }
  </style>

  <div class="cr-container">
    <div class="cr-head cr-head--center mt-reveal">
      <span class="cr-eyebrow">Proof</span>
      <h2 class="cr-h-section">High-Friction Teams Trust Acme to Automate the Work &mdash; Fast.</h2>
    </div>

    <div class="mt-grid">
      <div class="cr-card mt-tile mt-reveal">
        <span class="cr-dot mt-dot" style="--accent: var(--cr-brand);" aria-hidden="true"></span>
        <span class="cr-num-display mt-num"><span class="cr-count" data-target="73">73</span>%</span>
        <span class="cr-caption">less manual cycle time</span>
      </div>
      <div class="cr-card mt-tile mt-reveal" style="--d:.06s">
        <span class="cr-dot mt-dot" style="--accent: var(--cr-teal);" aria-hidden="true"></span>
        <span class="cr-num-display mt-num"><span class="cr-count" data-target="3">3</span> wks</span>
        <span class="cr-caption">to first agent live in production</span>
      </div>
      <div class="cr-card mt-tile mt-reveal" style="--d:.12s">
        <span class="cr-dot mt-dot" style="--accent: var(--cr-brand);" aria-hidden="true"></span>
        <span class="cr-num-display mt-num"><span class="cr-count" data-target="5">5</span>&times;</span>
        <span class="cr-caption">FTE-equivalent capacity freed</span>
      </div>
      <div class="cr-card mt-tile mt-reveal" style="--d:.18s">
        <span class="cr-dot mt-dot" style="--accent: var(--cr-success);" aria-hidden="true"></span>
        <span class="cr-num-display mt-num">$<span class="cr-count" data-target="750">750</span>K</span>
        <span class="cr-caption">saved per year, typical</span>
      </div>
    </div>
  </div>
</section>
