<!-- CURATED EXEMPLAR — archetype: integrations. Authored on the house .cr-* system (v2 re-theme); rhythm referenced from Website-offscript-v2/fragments/integration-grid.html. Match the rhythm/discipline; do NOT clone. -->
<section id="integrations" class="cr-band-light cr-section" aria-label="Integrations">
  <style>
    /* doc-scoped: grouped tile grid + tile shell + request link ONLY. Tiles compose
       the house card hairline + .cr-ico glyphs; grouped (not 40 ungrouped) per the
       integrations discipline. Names are tonal mono wordmarks (no <img>). */
    #integrations .ig-group { margin-top: var(--cr-space-10); }
    #integrations .ig-group + .ig-group { margin-top: var(--cr-space-8); }
    #integrations .ig-glabel { display: block; font-family: var(--cr-font-body); font-weight: 600;
      font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--cr-fg-3);
      margin-bottom: var(--cr-space-4); }
    #integrations .ig-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--cr-space-4); }
    #integrations .ig-tile { display: flex; align-items: center; gap: var(--cr-space-3);
      padding: var(--cr-space-4) var(--cr-space-5); border: 1px solid var(--cr-line);
      border-radius: var(--cr-radius-md); background: var(--cr-bg); }
    #integrations .ig-mark { width: 34px; height: 34px; flex: none; border-radius: var(--cr-radius-sm);
      display: inline-flex; align-items: center; justify-content: center; background: var(--cr-bg-grey-100); }
    #integrations .ig-mark svg { width: 18px; height: 18px; stroke: var(--cr-fg-2); stroke-width: 1.75;
      fill: none; stroke-linecap: round; stroke-linejoin: round; }
    #integrations .ig-name { font-family: var(--cr-font-display); font-weight: 700; font-size: 15px; color: var(--cr-fg); }
    #integrations .ig-foot { margin-top: var(--cr-space-8); }
    #integrations .ig-reveal { animation: igRise .6s cubic-bezier(.16,1,.3,1) both; animation-delay: var(--d, 0s); }
    @keyframes igRise { from { transform: translateY(14px); } to { transform: none; } }
    @media (prefers-reduced-motion: reduce) { #integrations .ig-reveal { animation: none; } }
    @media (max-width: 900px) { #integrations .ig-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 480px) { #integrations .ig-grid { grid-template-columns: 1fr; } }
  </style>

  <div class="cr-container">
    <div class="cr-head ig-reveal" style="--d:.04s">
      <span class="cr-eyebrow">Integrations</span>
      <h2 class="cr-h-section">It Works Where Your Work Already Lives.</h2>
      <p class="cr-p-lede">Agents read and write across the systems you run today &mdash; no rip-and-replace, no new place to check.</p>
    </div>

    <div class="ig-group ig-reveal" style="--d:.1s">
      <span class="ig-glabel">Records &amp; finance</span>
      <div class="ig-grid">
        <div class="ig-tile"><span class="ig-mark"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/></svg></span><span class="ig-name">NetSuite</span></div>
        <div class="ig-tile"><span class="ig-mark"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/></svg></span><span class="ig-name">SAP</span></div>
        <div class="ig-tile"><span class="ig-mark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg></span><span class="ig-name">QuickBooks</span></div>
        <div class="ig-tile"><span class="ig-mark"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 5v14"/></svg></span><span class="ig-name">Workday</span></div>
      </div>
    </div>

    <div class="ig-group ig-reveal" style="--d:.16s">
      <span class="ig-glabel">CRM &amp; communication</span>
      <div class="ig-grid">
        <div class="ig-tile"><span class="ig-mark"><svg viewBox="0 0 24 24"><path d="M3 8l9 6 9-6"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg></span><span class="ig-name">Gmail</span></div>
        <div class="ig-tile"><span class="ig-mark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></svg></span><span class="ig-name">Salesforce</span></div>
        <div class="ig-tile"><span class="ig-mark"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H7l-3 4z"/></svg></span><span class="ig-name">Slack</span></div>
        <div class="ig-tile"><span class="ig-mark"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 9h8M8 13h5"/></svg></span><span class="ig-name">HubSpot</span></div>
      </div>
    </div>

    <p class="ig-foot ig-reveal" style="--d:.22s"><a class="cr-link" href="#">Don&rsquo;t see yours? Request an integration <span class="cr-arrow" aria-hidden="true">&rarr;</span></a></p>
  </div>
</section>
