<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stat cards</title>
<link rel="stylesheet" href="../../brand-pack/colors_and_type.css">
<!-- No-JS fallback: cards visible, numbers already show the formatted final
     value from the SSR markup (`3x`, `70%`, `1K+`, etc.). -->
<noscript><style>.card { opacity: 1 !important; transform: none !important; }</style></noscript>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    /* ONE PAGE SURFACE. The v2 section sat on the brand black canvas with grey
       cards floating on it. The dark tier is DORMANT in the current direction —
       dark surfaces are not part of this website language — so the inversion
       goes and the contrast is rebuilt where the direction actually keeps it:
       in the SCALE of the measure against everything around it. This section is
       still the page's loudest claim; it is now loud typographically instead of
       tonally, which is the only kind of loud the direction has. */
    background: var(--cr-page-ground);
    font-family: var(--cr-font-body);
    color: var(--cr-text-secondary);
    -webkit-font-smoothing: antialiased;
  }

  /* ── Section ──────────────────────────────────────────────────
     Surface, section padding and the well are the pack's (`.cr-band`,
     `.cr-well`) — SECTION_LAYOUT §16. Nothing re-declared here. */

  /* ── Centred headline ─────────────────────────────────────────
     Centring the BOX is not centring the CONTENT: the measure still caps it. */
  .headline {
    text-align: center;
    max-width: var(--cr-measure-title);
    margin: 0 auto var(--cr-rhythm-content);
  }

  /* ── Row of cards ───────────────────────────────────────────── */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--cr-space-s);
  }

  /* A card is the raised surface, the card radius, one hairline and no depth —
     all of it from `.cr-card` on the element itself. What stays local is the
     COMPOSITION: a square-ish tile whose measure sits at the bottom, which is
     what makes four of them read as one wall rather than four panels. */
  .card {
    position: relative;
    aspect-ratio: 1 / 1.05;
    padding: var(--cr-space-m);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;

    /* Hidden until the section enters the viewport. CSS animation (NOT a
       transition) is triggered by `.section.in-view`, so the IO callback
       can't cancel the starting frame. <noscript> fallback above keeps
       cards visible if JS is off. */
    opacity: 0;
    transform: translateY(12px);
  }

  /* THE DOT WAS THE DASHBOARD. A small round coloured light in the corner of a
     metric tile is the status-indicator idiom, and it is the single thing that
     made this section read as an instrument panel rather than as a claim. It
     keeps its element and its position and becomes the system's one square
     mark, in ink — architectural, and carrying no accent it has no reason to
     spend. Four accent dots would also be four accent moments in one band. */
  .dot {
    position: absolute;
    top: var(--cr-space-m); left: var(--cr-space-m);
    width: var(--cr-marker-size); height: var(--cr-marker-size);
    border-radius: var(--cr-marker-radius);
    background: var(--cr-text-primary);
  }

  /* Number — the metric role: large numerical hierarchy, minimal decoration,
     emphasis from scale. Tabular figures keep the digit width stable so the
     number does not wobble as it counts. */
  .num { font-variant-numeric: tabular-nums; }

  /* Caption — supporting text, one step below body, untracked. */
  .cap { margin-top: var(--cr-space-xs); }

  /* ── Entrance animation (CSS animation, not transition) ──────── */
  .section.in-view .card {
    animation: card-in .55s ease forwards;
    animation-delay: var(--delay, 0ms);
  }
  @keyframes card-in { to { opacity: 1; transform: none; } }

  /* A GUARD THAT LOSES THE CASCADE IS NOT A GUARD. The v2 file declares this
     snap and never achieves it: `.section.in-view .card` outranks a bare
     `.card`, so the entrance ran at full length for every reader who asked for
     less motion. The declaration was right and its specificity was wrong —
     matching the trigger's shape is the whole fix, and it is a style-layer
     correction, not a change to what the section does. Surfaced by the
     rendered-state check, which is the only place a lost cascade is visible. */
  @media (prefers-reduced-motion: reduce) {
    .card,
    .section.in-view .card { opacity: 1; transform: none; animation: none; }
  }

  /* ── Responsive ─────────────────────────────────────────────────
     The original's breakpoints; responsive behaviour is frozen. Type steps
     with the pack's ramp and is not re-declared. */
  @media (max-width: 1024px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .card  { padding: var(--cr-space-s); }
    .dot   { top: var(--cr-space-s); left: var(--cr-space-s); }
  }
  @media (max-width: 640px) {
    .cards { grid-template-columns: 1fr; gap: var(--cr-space-xs); }
    .card  { aspect-ratio: auto; min-height: var(--cr-space-3xl); }
  }
</style>
</head>
<body>
<!-- geometry-budget — every dimension this specimen moves, declared.
     Predicate 6 fails on any change not listed here, and on any line
     here that moved nothing. Retrofitted from measurement for the pilot
     ten; declared before authoring from Phase 1 onward.
  .cap      | font-size              | type-ramp
  .cap      | line-height            | type-ramp
  .cap      | max-width              | measure
  .card     | border-bottom-width    | stroke
  .card     | border-left-width      | stroke
  .card     | border-radius          | radius-pair
  .card     | border-right-width     | stroke
  .card     | border-top-width       | stroke
  .card     | min-height             | spacing-scale
  .card     | padding-bottom         | spacing-scale
  .card     | padding-left           | spacing-scale
  .card     | padding-right          | spacing-scale
  .card     | padding-top            | spacing-scale
  .cards    | column-gap             | spacing-scale
  .cards    | row-gap                | spacing-scale
  .headline | font-size              | type-ramp
  .headline | line-height            | type-ramp
  .headline | margin-bottom          | spacing-scale
  .headline | margin-left            | spacing-scale
  .headline | margin-right           | spacing-scale
  .headline | max-width              | measure
  .num      | font-size              | type-ramp
  .num      | line-height            | type-ramp
  .wrap     | padding-left           | spacing-scale
  .wrap     | padding-right          | spacing-scale
-->


<section class="section cr-band" data-screen-label="Stat cards"
         data-archetype="feature-comparison" data-hierarchy="proof" data-intent="prove"
         data-register="confident" data-signature="large-statistic" data-density="high">
  <div class="wrap cr-well">
    <h2 class="headline cr-h-section">High-growth teams trust Example Brand to deliver outcomes, fast.</h2>

    <!-- 4 cards by default (matches reference). Each `.num` carries:
         data-target = the raw end value (integer)
         data-suffix = the inline unit (%, x, +, etc.) — optional
         The rendered text content IS the already-formatted final value, so
         the section reads correctly without JS (noscript fallback). -->
    <div class="cards">
      <article class="card cr-card">
        <span class="dot" aria-hidden="true"></span>
        <div class="num cr-num-display" data-target="3" data-suffix="x">3x</div>
        <div class="cap cr-meta">Faster to hire</div>
      </article>
      <article class="card cr-card">
        <span class="dot" aria-hidden="true"></span>
        <div class="num cr-num-display" data-target="70" data-suffix="%">70%</div>
        <div class="cap cr-meta">Interview rate</div>
      </article>
      <article class="card cr-card">
        <span class="dot" aria-hidden="true"></span>
        <div class="num cr-num-display" data-target="98" data-suffix="%">98%</div>
        <div class="cap cr-meta">Satisfaction rate</div>
      </article>
      <!-- Million-scale demo — `data-target="2000000"` exercises the K/M
           formatter end-to-end: the count ticks 1 → … → 1K → … → 1M → 2M
           and lands on "2M+". Drop the suffix or change the target to see
           other compaction tiers (e.g. 1500000 → "1.5M"). -->
      <article class="card cr-card">
        <span class="dot" aria-hidden="true"></span>
        <div class="num cr-num-display" data-target="2000000" data-suffix="+">2M+</div>
        <div class="cap cr-meta">Candidates matched</div>
      </article>
    </div>
  </div>
</section>

<script>
  const section = document.querySelector('.section');
  const cards   = section.querySelectorAll('.card');
  const nums    = section.querySelectorAll('.num');

  // K / M compaction — applied EVERY frame of the count-up, not just at
  // the end. So a count to 1,000,000 ticks "1 → … → 1K → … → 1M" instead
  // of a chaotic 6-digit ticker.
  function formatStat(n) {
    if (n >= 1e6) {
      return (n / 1e6).toFixed(n < 1e7 ? 1 : 0).replace(/\.0$/, '') + 'M';
    }
    if (n >= 1e3) {
      return Math.floor(n / 1e3) + 'K';
    }
    return Math.floor(n).toString();
  }

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function countUp(el) {
    const target = parseFloat(el.dataset.target);
    const suffix = el.dataset.suffix || '';
    // Reduced motion: snap straight to the final formatted value.
    if (reduced || !isFinite(target)) {
      el.textContent = formatStat(target) + suffix;
      return;
    }
    const duration = 1500;
    const start = performance.now();
    const ease = t => 1 - Math.pow(1 - t, 3);    // ease-out cubic
    function tick(now) {
      const t = Math.min(1, (now - start) / duration);
      el.textContent = formatStat(Math.max(1, target * ease(t))) + suffix;
      if (t < 1) {
        requestAnimationFrame(tick);
      } else {
        el.textContent = formatStat(target) + suffix;
      }
    }
    requestAnimationFrame(tick);
  }

  // Stagger card entrance by 80ms per card via a --delay CSS var.
  cards.forEach((c, i) => c.style.setProperty('--delay', (i * 80) + 'ms'));

  // Viewport entrance — once per page load, then unobserve. Same pattern
  // as `component-compare-table.html` so the section's first paint matches
  // the rest of the system.
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('in-view');
          // Fire count-up for every .num inside the section.
          e.target.querySelectorAll('.num').forEach(countUp);
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.15 });
    io.observe(section);
  } else {
    section.classList.add('in-view');
    nums.forEach(n => {
      n.textContent =
        formatStat(parseFloat(n.dataset.target)) + (n.dataset.suffix || '');
    });
  }
</script>

</body>
</html>
