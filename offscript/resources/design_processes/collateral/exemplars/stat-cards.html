  <div class="cr-stat-card tone-periwinkle">

</div>
<div style="font:400 11px/1.5 Inter; color:#616161; margin-top:14px">Stat cards · soft-clay tonal surface (periwinkle) · numerals in primary dark text (#020B1B), never an accent colour.</div>
