<body style="background:#FFFFFF">
<div class="card">
  <div class="label">Geometric motifs (used sparingly)</div>
  <!-- trapezoid banner -->
  <div style="position:relative; height:60px">
    <svg width="100%" height="60" viewBox="0 0 660 60" preserveAspectRatio="none"><path d="M 0 0 L 540 0 L 660 60 L 0 60 Z" fill="#020B1B"/></svg>

  </div>

  <div style="display:flex; gap:14px; align-items:center">

  </div>
  <div style="font:400 12px/1.5 Inter; color:#616161">Concentric oval rings and the ember stripe/chevron have been removed from the system. Remaining motifs are navy clips, used sparingly within the Swiss grid.</div>
