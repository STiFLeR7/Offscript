<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row">
    <div class="tile" style="flex:2; min-width:280px"><div class="swatch" style="background:var(--grad-iris); aspect-ratio:2.4"></div><div class="name">Iris gradient</div><div class="meta">--grad-iris · cover / hero accent ONLY</div></div>
    <div class="tile" style="flex:1.6; min-width:220px"><div class="swatch dark" style="background:var(--grad-night); aspect-ratio:2.4"></div><div class="name">Night gradient</div><div class="meta">--grad-night · navy</div></div>
  </div>
  <div class="row">
    <div class="tile" style="flex:1"><div class="swatch dark" style="background:var(--grad-protect-dn); aspect-ratio:3"></div><div class="name">Protect ↓</div><div class="meta">navy · over photo, content sits at bottom</div></div>
    <div class="tile" style="flex:1"><div class="swatch dark" style="background:var(--grad-protect-up); aspect-ratio:3"></div><div class="name">Protect ↑</div><div class="meta">navy · over photo, content sits at top</div></div>
  </div>
</div>
</body></html>
