<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Render Fixture</title>
<link rel="stylesheet" href="../../colors_and_type.css">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="FAQ.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function BookingModal({ open, onClose }) {
  const [step, setStep] = useState(0);
  if (!open) return null;
  return (
    <div className="modal-back" onClick={onClose}>
      <div className="modal">Book your audit (step {step})</div>
    </div>
  );
}

function App() {
  const [bookOpen, setBookOpen] = useState(false);
  const openBook = () => setBookOpen(true);

  useEffect(() => {
    if (window.lucide) window.lucide.createIcons();
  });

  return (
    <div data-app="root">
      <Hero onCTA={openBook} />
      <FAQ />
      <Footer />
      <BookingModal open={bookOpen} onClose={() => setBookOpen(false)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
