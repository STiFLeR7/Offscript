<!doctype html><html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="card.css">
<style>
.btn{font-family:Inter;font-weight:500;font-size:20px;line-height:1.7;padding:12px 24px;border-radius:50px;border:0;display:inline-flex;align-items:center;gap:10px;cursor:pointer;transition:transform .15s ease}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--cr-brand);color:#fff}
.btn-secondary-dark{background:#fff;color:#000;font-weight:700;font-size:14px;padding:12px 18px;letter-spacing:-.02em}
.btn-tertiary{background:transparent;color:var(--cr-fg);font-size:16px}
.surface-dark{background:var(--cr-ink-flat);padding:24px;border-radius:12px}
</style><link rel="stylesheet" href="../_frozen-v2-tokens.css"></head><body>
<div class="col gap-6">
  <div class="row gap-4" style="flex-wrap:wrap;align-items:center">
    <button class="btn btn-primary">Book a Demo Call →</button>
    <button class="btn btn-primary" style="font-size:16px;padding:10px 18px">Show for My Ops →</button>
    <button class="btn btn-tertiary">See Case Studies →</button>
  </div>
  <div class="surface-dark row gap-4" style="align-items:center">
    <button class="btn btn-primary">Get My No-Cost Process Audit →</button>
    <button class="btn btn-secondary-dark">Let's talk</button>
  </div>
  <div class="muted" style="font-family:var(--cr-font-mono);font-size:11px">Pill (radius 500) · primary var(--cr-brand) · arrow lives inside the label span, no icon component.</div>
</div>
</body></html>
