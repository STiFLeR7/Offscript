<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Divider · halftone dot dissolve, light → dark (use sparingly)</title>
<link rel="stylesheet" href="../_frozen-v2-tokens.css">
<!--
  COMPONENT   — Divider: halftone dot dissolve (light → dark). A transition DEVICE,
                NOT a between-every-section rule. USE SPARINGLY — drop it in once in
                a while where a light section hands off into a deliberate dark band
                (a CTA, a closing band), not on every section seam (charter:
                "sections divided by surface, not rules"). The strip carries no copy
                and no controls — it is pure transition art.
  DISTINCT     — Three other dividers already live in the library; this is none of
                them: `component-divider.html` (soft brand-blue→cream GRADIENT band),
                `component-divider-horizon.html` (dark planet-limb/horizon curve),
                and `component-divider-dither.html` (Bayer ORDERED-DITHER that runs
                DARK→light with ragged "drip" columns). THIS one is the clean,
                SYMMETRIC true-HALFTONE (dot SIZE encodes tone) that runs LIGHT→DARK
                around a thin solid crossover — no drips, no ragged edge.
  COMPOSITION — (user-supplied reference, wide monochrome strip) Top-down: tall pure
                -light headroom (~28%) → a fine field of dark dots that GROW + densify
                row by row → a thin SOLID crossover band (~50% down) → mirrored white
                speckle dots that SHRINK and fade out → solid dark to the bottom edge.
                Aligned square dot grid (columns line up); the size ramp + the thin
                solid line + the mirrored white-speckle tail all match the source.
  RE-SKIN     — Source is pure white → pure black; no hue to translate, so it stays
                neutral per the fidelity contract (brand wins on hue only when the
                source HAS one). Only forced change: black → --cr-ink (#0E0E0E); CR
                never uses pure black. NO brand blue inside the divider.
  SEAM        — The light end inherits the surface above via --divider-top (default
                --cr-bg #FFFFFF), so it joins white OR warm bands with no step. The
                dark end is baked to --cr-ink and the dark band below is the SAME
                --cr-ink with zero gap, so the ink reads as one continuous surface
                (the charter's "hard seam" failure mode designed out on both edges).
  CHARTER     — Transition DEVICE, not decoration on a content-bearing light band, so
                it does not break "light bands stay flat": it is the dark-band dot-
                CONSTELLATION motif rendered as a dissolve (same family as the CTA
                band's dot-matrix). No shadow / glow / blur — pure two-tone fill. No
                text, no controls → no hover, nothing to focus; the adjacent sections
                own the focal point. Direction is LIGHT→DARK only (per request); for a
                dark→light exit add `transform: scaleY(-1)` and swap the two ends.
  MOTION      — None (static), by request. Fixed graphic; nothing animates, so it is
                fully inert and identical with or without JS.
  TECH        — The dots are ONE seamless SVG tile (a single dot column, full band
                height) embedded as a data-URI background with `repeat-x` +
                `background-size: auto 100%`: dots stay perfectly circular, tile
                crisply at ANY width, and scale proportionally as the band height
                steps down. Pure CSS — no JS, no external asset. The tile is
                generated by `tools/_gen_halftone.py` (H=243, P=9, a=.28, m=.51, z=.72,
                gamma=1.5; the ink colour is BAKED into the data-URI — re-run that
                script to retarget the dark end). The light/dark CONTEXT bands here
                are intentionally minimal — they only show the transition; the
                divider is the component.
  RESPONSIVE  — Band height 240 → 190 (≤900) → 140 (≤600); the tile scales with it
                so the halftone stays proportional and the dots keep reading.
  Standalone: links ../colors_and_type.css only; own <style>; no shared CSS.
-->
<script>document.documentElement.classList.add("has-js");</script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--cr-bg);
    font-family: var(--cr-font-body);
    color: var(--cr-ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .cr-divider-demo { width: 100%; }

  .demo-inner {
    max-width: var(--cr-content-max);   /* 1240 */
    margin: 0 auto;
    padding: 0 var(--cr-page-gutter);   /* 100 */
  }

  /* ── Context band: the LIGHT section above (minimal — not the component) ── */
  .band-light {
    background: var(--cr-bg);            /* #FFFFFF — matches the divider's light end */
    padding: 88px 0 44px;
  }
  .band-light .eyebrow { margin: 0 0 12px; }
  .band-light .line { margin: 0; max-width: 30ch; }

  /* ── THE DIVIDER ─────────────────────────────────────────────────────────
     Full-bleed strip. background-color paints the LIGHT end (the tile's top is
     transparent and shows it through); the tile's baked ink rect paints the
     DARK end. background-size:auto 100% locks the tile to the band height so the
     dots stay round and tile across any width. */
  .cr-divider {
    --divider-top: var(--cr-bg);        /* colour of the section above; set to
                                           --cr-bg-warm etc. when the band differs */
    height: 240px;
    background-color: var(--divider-top);
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%229%22%20height%3D%22243%22%20viewBox%3D%220%200%209%20243%22%3E%3Crect%20x%3D%220%22%20y%3D%22123.93%22%20width%3D%229%22%20height%3D%22119.07%22%20fill%3D%22%230E0E0E%22%2F%3E%3Ccircle%20cx%3D%224.50%22%20cy%3D%2276.50%22%20r%3D%220.51%22%20fill%3D%22%230E0E0E%22%2F%3E%3Ccircle%20cx%3D%224.50%22%20cy%3D%2285.50%22%20r%3D%221.07%22%20fill%3D%22%230E0E0E%22%2F%3E%3Ccircle%20cx%3D%224.50%22%20cy%3D%2294.50%22%20r%3D%221.79%22%20fill%3D%22%230E0E0E%22%2F%3E%3Ccircle%20cx%3D%224.50%22%20cy%3D%22103.50%22%20r%3D%222.66%22%20fill%3D%22%230E0E0E%22%2F%3E%3Ccircle%20cx%3D%224.50%22%20cy%3D%22112.50%22%20r%3D%223.64%22%20fill%3D%22%230E0E0E%22%2F%3E%3Ccircle%20cx%3D%224.50%22%20cy%3D%22121.50%22%20r%3D%224.73%22%20fill%3D%22%230E0E0E%22%2F%3E%3Ccircle%20cx%3D%224.50%22%20cy%3D%22130.50%22%20r%3D%224.10%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Ccircle%20cx%3D%224.50%22%20cy%3D%22139.50%22%20r%3D%222.92%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Ccircle%20cx%3D%224.50%22%20cy%3D%22148.50%22%20r%3D%221.88%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Ccircle%20cx%3D%224.50%22%20cy%3D%22157.50%22%20r%3D%221.01%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Ccircle%20cx%3D%224.50%22%20cy%3D%22166.50%22%20r%3D%220.34%22%20fill%3D%22%23FFFFFF%22%2F%3E%3C%2Fsvg%3E");
    background-repeat: repeat-x;
    background-position: top center;
    background-size: auto 100%;          /* tile = band height → dots stay round */
  }

  /* ── Context band: the DARK section below (minimal — not the component) ── */
  .band-dark {
    background: var(--cr-ink);           /* var(--cr-ink-flat) — matches the divider's dark end */
    color: #FFFFFF;
    padding: 56px 0 96px;
  }
  .band-dark .title { margin: 0 0 10px; color: #FFFFFF; font-size: 28px; }
  .band-dark .sub { margin: 0; color: var(--cr-fg-muted); max-width: 42ch; }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .demo-inner { padding: 0 56px; }
    .cr-divider { height: 190px; }
    .band-light { padding: 72px 0 36px; }
    .band-dark  { padding: 48px 0 80px; }
  }
  @media (max-width: 600px) {
    .demo-inner { padding: 0 24px; }
    .cr-divider { height: 140px; }
    .band-light { padding: 56px 0 28px; }
    .band-dark  { padding: 40px 0 64px; }
    .band-dark .title { font-size: 24px; }
  }
</style>
</head>
<body>

  <section class="cr-divider-demo" data-screen-label="Divider · halftone dot dissolve (light → dark)">

    <!-- Context only: a light section ending. Kept minimal so the divider leads. -->
    <div class="band-light">
      <div class="demo-inner">
        <p class="cr-h-eyebrow eyebrow">Section above</p>
        <p class="cr-p-lede line">A light section closes here, then dissolves into the dark band below.</p>
      </div>
    </div>

    <!-- THE COMPONENT: the halftone dissolve strip. Inert, decorative. -->
    <div class="cr-divider" role="presentation" aria-hidden="true"></div>

    <!-- Context only: a dark section beginning. Kept minimal so the divider leads. -->
    <div class="band-dark">
      <div class="demo-inner">
        <h2 class="cr-h-group title">The dark section begins.</h2>
        <p class="cr-p sub">Use this dissolve sparingly — for the occasional move into a CTA or a major dark band, not between every section.</p>
      </div>
    </div>

  </section>

</body>
</html>
