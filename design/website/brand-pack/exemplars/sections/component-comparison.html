<!doctype html><html><head><meta charset="utf-8"><title>Comparison column</title>
<link rel="stylesheet" href="card.css"><link rel="stylesheet" href="../_frozen-v2-tokens.css"></head><body>
<div style="background:#fff;border-radius:24px;border:1px solid var(--cr-line);padding:20px;display:inline-flex">
  <div style="width:188px;padding:20px 0;display:flex;flex-direction:column;gap:18px">
    <div style="font-family:Urbanist;font-weight:700;font-size:16px;color:var(--cr-fg)">Factors</div>
    <div style="font-family:Inter;font-size:14px;color:var(--cr-fg-3)">Time to first result</div>
    <div style="font-family:Inter;font-size:14px;color:var(--cr-fg-3)">Who does the work</div>
    <div style="font-family:Inter;font-size:14px;color:var(--cr-fg-3)">Cost model</div>
    <div style="font-family:Inter;font-size:14px;color:var(--cr-fg-3)">Risk if underperforms</div>
    <div style="font-family:Inter;font-size:14px;color:var(--cr-fg-3)">Integration requirement</div>
    <div style="font-family:Inter;font-size:14px;color:var(--cr-fg-3)">What you get at the end</div>
  </div>
  <div style="width:200px;padding:20px;background:var(--cr-brand-100);border-radius:16px;display:flex;flex-direction:column;gap:18px">
    <div style="font-family:Urbanist;font-weight:700;font-size:16px;color:var(--cr-brand)">Example Brand APA</div>
    <div style="font-family:Inter;font-weight:600;font-size:14px;color:var(--cr-fg)">Live in 4 weeks</div>
    <div style="font-family:Inter;font-weight:600;font-size:14px;color:var(--cr-fg)">We build and deploy</div>
    <div style="font-family:Inter;font-weight:600;font-size:14px;color:var(--cr-fg)">Pay for results, not licenses</div>
    <div style="font-family:Inter;font-weight:600;font-size:14px;color:var(--cr-fg)">We work until it hits target</div>
    <div style="font-family:Inter;font-weight:600;font-size:14px;color:var(--cr-fg)">Works on your existing stack</div>
    <div style="font-family:Inter;font-weight:600;font-size:14px;color:var(--cr-fg)">Working agent in production</div>
  </div>
</div>
</body></html>
