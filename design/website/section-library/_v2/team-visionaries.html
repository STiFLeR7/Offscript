<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CR — Team · visionaries roster</title>
<link rel="stylesheet" href="../../brand-pack/exemplars/_frozen-v2-tokens.css">
<!--
  COMPONENT: Team — "visionaries" roster (header-in-grid + photoless member cell)
  (distinct from component-team-grid / -leadership / -about: here the section
   HEADER is itself a grid cell, and one member cell carries no photo at all)
  COMPOSITION: 3-column × 2-row grid (12px gaps, ~1200px well). The top-left
    cell is the section HEADER (square eyebrow + 2-line headline); the other 5
    cells are leader cards. Four are PHOTO cards (near-square photo ~1:1.06 over
    a grey name plate), and one is a NO-PHOTO card — a plain grey block with the
    name plate pinned to its TOP. The text-only header (top-left) and the
    photo-less card (bottom-right) sit on a diagonal and balance each other.
    Plate = name (Urbanist 600/24) + role caption (Inter 14) on the left, an
    inline SOLID LinkedIn brand-logo SVG bottom-right (the ONLY interactive
    control — reproduces the source's filled mark; LinkedIn is a brand logo, a
    carve-out from the Lucide-only charter rule, so NO Lucide is loaded — this
    matches the sibling component-team-grid / -leadership / -about). Sharp 0-radius
    corners + crisp photo→plate boundary, both faithful to the source (the
    name plate is a functional surface, not an atmospheric band — no fade).
  INSPIRATION: agency "Meet our visionaries" leadership grid (3×2, header cell
    top-left, one photo-less member cell). Layout/composition only; re-skinned to
    the CR kit — orange eyebrow → brand blue, fonts → Urbanist/Inter, German
    roster → CR-localized (Pune) leadership, stock photos → tone-matched Unsplash
    portraits saved locally (assets/avatars/leader-1..4.jpg, object-fit cover).
  MOTION: staggered scroll-reveal — header then each card fade + rise (16px) in
    sequence (--d 0/90/150/210/270/330ms) on first viewport hit
    (IntersectionObserver, fires once). Gated on `.has-js` so all content is
    visible without JS; `prefers-reduced-motion` snaps in. No card-wide hover —
    only the LinkedIn mark (a real link) reacts (grey → brand blue).
  RATIO / ROW NOTES: photo aspect 1/1.06 + equal 1fr columns ⇒ all four photos
    render the same height, so both rows match. The no-photo card and the header
    cell stretch to that row height via the grid's default align-items:stretch
    (no fixed row heights needed, nothing clips). Responsive: 2-col at ≤920px
    (header + the no-photo card span full width), single column at ≤560px.
  TONE: source palette is uniformly cool (blue/navy/grey) — portraits kept cool
    (suit / navy blazer / lavender shirt / white blazer), no warm pops.
-->
<style>
  .cr-team {
    background: var(--cr-bg);
    padding: clamp(72px, 9vw, 120px) clamp(20px, 5vw, 64px);
    font-family: var(--cr-font-body);
    color: var(--cr-fg);
  }
  .team-well { max-width: var(--cr-content-max); margin: 0 auto; }

  .team-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  /* ── Header cell (top-left) ─────────────────────────────── */
  .team-head {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    min-width: 0;
    padding: 4px 6px 0 0;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow .sq {
    width: 9px; height: 9px;
    background: var(--cr-brand);
    border-radius: 1px;
    flex: 0 0 auto;
  }
  .eyebrow .lbl {
    font-family: var(--cr-font-body);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--cr-brand);
  }
  .team-head h2 {
    margin: 44px 0 0;
    font-family: var(--cr-font-display);
    font-weight: 700;
    font-size: clamp(34px, 4vw, 48px);
    line-height: 1.08;
    letter-spacing: -0.02em;
    color: var(--cr-fg);
  }

  /* ── Leader card ────────────────────────────────────────── */
  .card {
    display: flex;
    flex-direction: column;
    background: var(--cr-bg-grey-100);   /* var(--cr-bg-grey-100) block on white page */
    min-width: 0;
  }
  .card .photo {
    width: 100%;
    aspect-ratio: 1 / 1.06;
    overflow: hidden;
    background: #e3e3e3;
  }
  .card .photo img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .card .plate {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 12px;
    padding: 20px 22px 22px;
  }
  .card .meta { min-width: 0; }
  .card .name {
    font-family: var(--cr-font-display);
    font-weight: 600;
    font-size: 24px;
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: var(--cr-fg);
  }
  .card .role {
    margin-top: 5px;
    font-family: var(--cr-font-body);
    font-weight: 500;
    font-size: 14px;
    line-height: 1.4;
    color: var(--cr-fg-3);
  }

  /* LinkedIn glyph — the lone interactive control */
  .li {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px; height: 34px;
    margin: 0 -6px -4px 0;
    color: var(--cr-fg-muted);
    transition: color .2s ease;
  }
  .li:hover, .li:focus-visible { color: var(--cr-brand); }
  .li:focus-visible { outline: 2px solid var(--cr-brand); outline-offset: 2px; }
  .li svg { width: 19px; height: 19px; display: block; fill: currentColor; }

  /* ── Scroll-reveal (gated on .has-js; visible without JS) ── */
  .cr-team.has-js .reveal { opacity: 0; transform: translateY(16px); }
  .cr-team.has-js .reveal.in {
    opacity: 1; transform: none;
    transition: opacity .6s ease, transform .6s cubic-bezier(.2,.7,.2,1);
    transition-delay: var(--d, 0ms);
  }
  @media (prefers-reduced-motion: reduce) {
    .cr-team.has-js .reveal { opacity: 1; transform: none; transition: none; }
  }

  /* ── Responsive ─────────────────────────────────────────── */
  @media (max-width: 920px) {
    .team-grid { grid-template-columns: repeat(2, 1fr); }
    .team-head { grid-column: 1 / -1; padding-bottom: 8px; }
    .team-head h2 { margin-top: 24px; }
    .card.noimg { grid-column: 1 / -1; }   /* CPO becomes a full-width name bar */
  }
  @media (max-width: 560px) {
    .team-grid { grid-template-columns: 1fr; }
    .team-head h2 { font-size: clamp(30px, 8vw, 38px); margin-top: 20px; }
    .card .name { font-size: 22px; }
  }
</style>
</head>
<body>

</section>

<script>
  (function () {
    var sec = document.querySelector('.cr-team');
    if (!sec || !('IntersectionObserver' in window)) return;
    sec.classList.add('has-js');
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) {
          sec.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('in'); });
          io.disconnect();
        }
      });
    }, { threshold: 0.15 });
    io.observe(sec);
  })();
</script>
</body>
</html>
