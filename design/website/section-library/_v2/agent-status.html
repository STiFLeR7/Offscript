<!doctype html><html><head><meta charset="utf-8"><title>Agent status</title>
<link rel="stylesheet" href="../../brand-pack/exemplars/sections/card.css"><link rel="stylesheet" href="../../brand-pack/exemplars/_frozen-v2-tokens.css"></head><body>
<div style="width:420px;background:#fff;border-radius:12px;border:1px solid var(--cr-line);padding:24px">
  <div style="font-family:Urbanist;font-weight:700;font-size:22px;color:var(--cr-fg)">Active Agent Workflow</div>
  <div class="muted" style="margin-top:4px;font-size:12px">Production environment · Autonomous execution</div>
  <hr style="border:0;border-top:1px solid var(--cr-bg-grey-100);margin:16px 0">
  <div class="row gap-4" style="align-items:center;justify-content:space-between">
    <div><div style="font-family:Urbanist;font-weight:700;font-size:28px">30–50%</div><div class="muted" style="font-size:12px">Cycle-time reduction</div></div>
    <div style="position:relative;width:96px;height:96px"><div style="position:absolute;inset:0;background:var(--cr-bg-grey-100);border-radius:50%"></div><div style="position:absolute;inset:0;background:conic-gradient(var(--cr-success-soft) 0 80%, transparent 80% 100%);border-radius:50%;mask:radial-gradient(circle, transparent 38px, #000 39px);-webkit-mask:radial-gradient(circle, transparent 38px, #000 39px)"></div></div>
  </div>
  <div style="margin-top:14px"><div style="font-family:Urbanist;font-weight:700;font-size:22px">80%</div><div class="muted" style="font-size:12px">Routine Operational Work Automated</div></div>
  <div style="display:flex;gap:2px;margin-top:10px">
    <!--bars-->
    <script>document.write(Array.from({length:60},(_,i)=>`<span style="display:inline-block;width:3px;height:18px;border-radius:1px;background:${i<48?'var(--cr-teal-400)':'var(--cr-line)'}"></span>`).join(''))</script>
  </div>
  <div style="margin-top:14px;display:flex;justify-content:space-between"><div style="font-family:Urbanist;font-weight:700;font-size:22px">99%</div><div class="muted" style="font-size:12px;align-self:flex-end">Enhancement</div></div>
</div>
</body></html>
