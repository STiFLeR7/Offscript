<!doctype html><html><head><meta charset="utf-8"><title>Stat tiles</title>
<link rel="stylesheet" href="../../brand-pack/exemplars/sections/card.css"><link rel="stylesheet" href="../../brand-pack/exemplars/_frozen-v2-tokens.css"></head><body>
<div class="row gap-6" style="align-items:flex-start;flex-wrap:wrap">
  <div style="width:240px;height:280px;border-radius:12px;background:var(--cr-bg-grey-100);padding:24px;display:flex;flex-direction:column;justify-content:space-between">
    <div style="font-family:Urbanist;font-weight:700;font-size:72px;line-height:1;color:var(--cr-brand-700)">3 Days</div>
    <div style="font-family:Inter;font-weight:500;font-size:18px;color:var(--cr-fg-3)">Payback</div>
  </div>

    <div style="font-family:Urbanist;font-weight:700;font-size:72px;line-height:1;color:#129B84">5 FTE</div>
    <div style="font-family:Inter;font-weight:500;font-size:18px;color:var(--cr-fg-3)">Automated</div>
  </div>

    <div style="font-family:Inter;font-weight:500;font-size:18px;position:relative">Cost Removal</div>
  </div>
