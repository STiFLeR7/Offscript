<!doctype html><html><head><meta charset="utf-8"><title>Industry chips</title>
<link rel="stylesheet" href="../../brand-pack/exemplars/sections/card.css">
<script src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.min.js" integrity="sha384-bdZtphetAEBgkGZvhZXOFDWc55tHGLqaSo1f4qZtgvEiolEBqlJ9u6FTk+CoLfj0" crossorigin="anonymous"></script>
<style>
.chip-row{display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:10px}
.chip-row.host{background:rgba(255,255,255,0.06);max-width:380px}
.chip-icn{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.chip-icn svg{width:18px;height:18px;stroke-width:1.8}
.chip-t{font-family:Urbanist;font-weight:600;font-size:18px;color:#fff}
.chip-s{font-family:Inter;font-size:13px;color:var(--cr-fg-muted);margin-top:2px}
</style><link rel="stylesheet" href="../../brand-pack/exemplars/_frozen-v2-tokens.css"></head><body style="background:var(--cr-ink-flat);padding:24px">
<div class="col gap-2" style="background:var(--cr-ink-violet);padding:20px;border-radius:14px;max-width:420px">
  <div class="chip-row"><div class="chip-icn" style="background:var(--cr-brand-700)"><i data-lucide="building-2"></i></div><div><div class="chip-t">BFSI</div><div class="chip-s">Compliance, claims, and reconciliation</div></div></div>
  <div class="chip-row"><div class="chip-icn" style="background:var(--cr-success-soft)"><i data-lucide="heart-pulse"></i></div><div><div class="chip-t">Healthcare</div><div class="chip-s">Documentation, audits, and intake</div></div></div>
  <div class="chip-row"><div class="chip-icn" style="background:#6694F0"><i data-lucide="users"></i></div><div><div class="chip-t">Staffing & Recruitment</div><div class="chip-s">Sourcing, screening, and onboarding</div></div></div>
  <div class="chip-row"><div class="chip-icn" style="background:var(--cr-amber)"><i data-lucide="package"></i></div><div><div class="chip-t">Supply Chain</div><div class="chip-s">Procurement, invoicing, and tracking</div></div></div>
</div>
<script>lucide.createIcons();</script>
</body></html>
