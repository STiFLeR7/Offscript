<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CR · Logo marquee — proof beat</title>

<!--
  ════════════════════════════════════════════════════════════════════════
  v3 SPECIMEN — Logo marquee (dark proof beat)  from component-logo-marquee.html
  ════════════════════════════════════════════════════════════════════════
  WHAT THIS IS  The v2 section authored under the v3 editorial-restraint
                direction. DOM, both script blocks, the `track` id and every
                behavioural hook are byte-compatible with the frozen original
                (DR-22, the Pilot Constraint). The v2 file sits beside this
                one in `_v2/`.

  THE SHAPE     THIS SECTION IS JS-AUTHORED. Its marks do not exist in the
                markup — the frozen script builds them from a template literal
                and assigns `innerHTML`. Anything styled inside that string
                would be unreachable, because the script may not be touched.
                It carries NONE: the literal holds two class hooks (`logo`,
                `name`) and no style attribute, no inline value, no colour.
                Every presentation decision in this file is therefore
                reachable from the sheet, and the two hooks are styled by
                name. No class added here may ever land inside that literal.

  THE CLAIM     **The same marks, given an accent band, stop attesting and
                start asserting.** The profile's own reading: `logo-strip` is
                a quiet rail under an opening; this is a beat mid-page, and
                the difference is treatment, not content. So the band stays
                dark and the title stays large — that IS the section.

  ACCENT        ONE moment, and it is the title's second clause. The band is
                the section's whole reason to exist and the accent names what
                the proof is about; on the dark ground the emphasis measures
                well clear of the AA floor at this size. The MARKS spend
                nothing — a logo wall is read one mark at a time, and colour
                there would turn the row into scenery. They are one ink,
                carried at a single opacity.

  ENVIRONMENT   NONE, and there is nothing to replace. The band's surface is a
                flat token (the dark ground); there is no gradient, no blurred
                bitmap and no tint wash in the file. The rule that retires
                abstract creative backgrounds has no subject here — and this
                section is wordmarks end to end, which is the one place the
                rule says a photograph does not go. The edge fade stays: it is
                a gradient on a MASK, an alpha channel rather than a surface.

  TYPE          The v2 heavy display weight collapses to the system's regular;
                emphasis comes from scale, not from a heavier face. Sizes step
                on the pack's own ramp, so the per-breakpoint overrides are
                gone rather than re-authored.

  MOTION        Unchanged in kind — an infinite leftward rail that pauses on
                hover so a reader can stop it and read a mark. Reduced motion
                stops it outright, and the guard keeps the original's
                specificity so it still wins the cascade.
  ════════════════════════════════════════════════════════════════════════
-->

<link rel="stylesheet" href="../../brand-pack/colors_and_type.css">
<script src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.min.js" integrity="sha384-bdZtphetAEBgkGZvhZXOFDWc55tHGLqaSo1f4qZtgvEiolEBqlJ9u6FTk+CoLfj0" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--cr-bg-dark);
    font-family: var(--cr-font-body); color: var(--cr-text-inverse);
    -webkit-font-smoothing: antialiased;
  }

  /* Dark band — the treatment that makes attribution read as a claim. */
  .section {
    background: var(--cr-bg-dark);
    padding: var(--cr-space-xl) var(--cr-page-gutter);
    max-width: var(--cr-content-max); margin: 0 auto;
  }

  /* ── Layout — title on top, marquee below (centred) ───────────── */
  .wrap { text-align: center; }

  /* Two-tone title. The accent stays a configurable custom property so a page
     can retarget it, and its default is the emphasis accent — the section's
     single accent moment. The gap below is the CONTENT role of the rhythm:
     the point where the band stops saying and starts showing. */
  .title {
    --accent: var(--cr-accent-orange);
    margin: 0 auto var(--cr-rhythm-content);
    max-width: var(--cr-measure-title);
    font-family: var(--cr-font-display);
    font-weight: 400;
    font-size: var(--cr-text-h3);
    line-height: var(--cr-leading-heading);
    letter-spacing: var(--cr-tracking-heading);
    color: var(--cr-text-inverse);
  }
  .title .accent { color: var(--cr-text-inverse); font-weight: 500; }
  /* Orange measures 2.40:1 and the pack forbids it as text at ANY size —
     44px does not rescue it. The clause is emphasised by weight, which is
     what the direction says hierarchy is carried by. */

  /* ── Marquee ──────────────────────────────────────────────────
     The edge mask fades marks out on the left and in from the right.
     `black` here is an alpha value in a mask, not a colour: nothing is
     painted with it and no surface takes it. */
  .marquee {
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
  }
  .track {
    display: flex; width: max-content; align-items: center;
    gap: var(--cr-space-xl);
    animation: logo-scroll 40s linear infinite;   /* moves leftward, infinite */
  }
  .marquee:hover .track { animation-play-state: paused; }   /* pause on hover */

  /* The set is rendered twice; shifting by exactly one copy (-50%) loops
     seamlessly for any number of marks. */
  @keyframes logo-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  /* A marquee must stop under reduced motion, at the specificity the trigger
     uses — a guard that loses the cascade is not a guard. */
  @media (prefers-reduced-motion: reduce) {
    .track { animation: none; }
  }

  /* ── Logo lockups (PLACEHOLDERS, built by the frozen script) ───
     `.logo` and `.name` are the two hooks the template literal emits; nothing
     else may be added there, so everything below is reached by those names.
     Replace each mark with a real <img src="…/logos/<name>.svg"> when the
     assets land. One ink at one opacity — attribution, not decoration. */
  .logo {
    flex-shrink: 0;
    display: inline-flex; align-items: center; gap: var(--cr-space-xs);
    color: var(--cr-text-inverse);
    opacity: 0.62;                   /* static — these are not controls */
    cursor: default; white-space: nowrap;
  }
  .logo svg { width: 24px; height: 24px; stroke-width: var(--cr-icon-stroke-md); }
  .logo .name {
    font-family: var(--cr-font-display);
    font-weight: 400;
    font-size: var(--cr-text-body);
    letter-spacing: var(--cr-tracking-heading);
  }

  /* ── Responsive — the ORIGINAL's breakpoints (1024 / 640) ──────
     Type is NOT re-declared: the pack steps its own ramp, and a size
     re-authored per breakpoint is a size off the ramp. */
  @media (max-width: 1024px) {
    .section { padding: var(--cr-space-m) var(--cr-page-gutter); }
    .track { gap: var(--cr-space-m); }
  }
  @media (max-width: 640px) {
    .section { padding: var(--cr-space-m) var(--cr-page-gutter); }
    .marquee {
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 5%, black 95%, transparent 100%);
              mask-image: linear-gradient(to right, transparent 0%, black 5%, black 95%, transparent 100%);
    }
    .track { gap: var(--cr-space-m); }
    .logo svg { width: 20px; height: 20px; }
  }
</style>
</head>
<body>
<!-- geometry-budget — every dimension this specimen moves, declared.
     Predicate 6 fails on any change not listed here, and on any line here that
     moved nothing. Nothing is marked `directed`: the band is a title over a
     rail and stays exactly that. Note what is ABSENT — no `stroke` line, because
     the mark stroke was already the medium icon weight and moving it onto the
     token moved nothing; and no line for the marks themselves, because they do
     not exist in the markup. They are built by the frozen script, so every
     dimension they carry is reached through `.logo` / `.name`.
  .accent | font-size              | type-ramp
  .accent | line-height            | type-ramp
  .logo   | column-gap             | spacing-scale
  .logo   | row-gap                | spacing-scale
  .name   | font-size              | type-ramp
  .title  | font-size              | type-ramp
  .title  | line-height            | type-ramp
  .title  | margin-bottom          | spacing-scale
  .title  | margin-left            | spacing-scale
  .title  | margin-right           | spacing-scale
  .title  | max-width              | measure
  .track  | column-gap             | spacing-scale
  .track  | row-gap                | spacing-scale
-->

<section class="section" data-screen-label="Logo marquee"
         data-archetype="editorial-stack" data-hierarchy="proof" data-intent="build-trust"
         data-register="immersive" data-signature="colour-interruption" data-density="low">
  <div class="wrap">
    <!-- Two-tone title: inverse base + accent span (configurable via --accent). -->
    <h2 class="title">Trusted By Operations Teams In <span class="accent">Regulated Industries</span></h2>

    <div class="marquee">
      <!-- The marks SHIP, and the set appears TWICE because the -50% translate
           loops on a doubled track — the duplication is the mechanism, not an
           authoring error. Each {icon, name} pair is a declared PLACEHOLDER:
           swap it for a real SVG mark when brand assets land. Inlined so the
           band arrives populated from retrieval rather than after a script
           has run (DR-58). -->
      <div class="track" id="track">
        <!-- set 1 of 2 -->
        <div class="logo"><i data-lucide="landmark"></i><span class="name">Brookline Bank</span></div>
        <div class="logo"><i data-lucide="heart-pulse"></i><span class="name">Meridian Health</span></div>
        <div class="logo"><i data-lucide="package"></i><span class="name">Kestrel Logistics</span></div>
        <div class="logo"><i data-lucide="users"></i><span class="name">Alvora Staffing</span></div>
        <div class="logo"><i data-lucide="wind"></i><span class="name">Northwind</span></div>
        <div class="logo"><i data-lucide="line-chart"></i><span class="name">Halcyon Capital</span></div>
        <!-- set 2 of 2 — the seamless loop -->
        <div class="logo"><i data-lucide="landmark"></i><span class="name">Brookline Bank</span></div>
        <div class="logo"><i data-lucide="heart-pulse"></i><span class="name">Meridian Health</span></div>
        <div class="logo"><i data-lucide="package"></i><span class="name">Kestrel Logistics</span></div>
        <div class="logo"><i data-lucide="users"></i><span class="name">Alvora Staffing</span></div>
        <div class="logo"><i data-lucide="wind"></i><span class="name">Northwind</span></div>
        <div class="logo"><i data-lucide="line-chart"></i><span class="name">Halcyon Capital</span></div>
      </div>
    </div>
  </div>
</section>

<script>
  lucide.createIcons();
</script>
</body>
</html>
