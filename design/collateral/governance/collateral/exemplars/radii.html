<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row">
    <div class="tile" style="flex:1"><div class="swatch" style="background:#FFFFFF; aspect-ratio:3; border-radius:0"></div><div class="meta">0 · square (paper / brochure pages)</div></div>
    <div class="tile" style="flex:1"><div class="swatch" style="background:#FFFFFF; aspect-ratio:3; border-radius:4px"></div><div class="meta">4 · radius-sm (chips, tight pills)</div></div>
    <div class="tile" style="flex:1"><div class="swatch" style="background:#FFFFFF; aspect-ratio:3; border-radius:8px"></div><div class="meta">8 · radius (default cards & buttons)</div></div>
    <div class="tile" style="flex:1"><div class="swatch" style="background:#FFFFFF; aspect-ratio:3; border-radius:12px"></div><div class="meta">12 · radius-lg (stat hero cards)</div></div>
    <div class="tile" style="flex:1"><div class="swatch" style="background:#FFFFFF; aspect-ratio:3; border-radius:999px"></div><div class="meta">999 · pill (icon chips, CTA pills)</div></div>
  </div>
</div>
</body></html>
