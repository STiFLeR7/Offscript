<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row" style="align-items:flex-end">
    <div class="tile" style="max-width:60px"><div style="height:4px; background:#149DFF; border-radius:2px"></div><div class="meta">4</div></div>
    <div class="tile" style="max-width:60px"><div style="height:8px; background:#149DFF; border-radius:2px"></div><div class="meta">8</div></div>
    <div class="tile" style="max-width:60px"><div style="height:12px; background:#149DFF; border-radius:2px"></div><div class="meta">12</div></div>
    <div class="tile" style="max-width:60px"><div style="height:16px; background:#149DFF; border-radius:2px"></div><div class="meta">16</div></div>
    <div class="tile" style="max-width:60px"><div style="height:20px; background:#149DFF; border-radius:2px"></div><div class="meta">20</div></div>
    <div class="tile" style="max-width:60px"><div style="height:24px; background:#149DFF; border-radius:2px"></div><div class="meta">24</div></div>
    <div class="tile" style="max-width:60px"><div style="height:32px; background:#149DFF; border-radius:2px"></div><div class="meta">32</div></div>
    <div class="tile" style="max-width:60px"><div style="height:40px; background:#149DFF; border-radius:2px"></div><div class="meta">40</div></div>
    <div class="tile" style="max-width:60px"><div style="height:48px; background:#149DFF; border-radius:2px"></div><div class="meta">48</div></div>
  </div>
  <div class="meta" style="font:400 12px/1.4 var(--font-mono); color:#616161">4-pt scale · A4 page padding = 16mm · grid gutter = 8mm · section gap = 6–10mm</div>
</div>
</body></html>
