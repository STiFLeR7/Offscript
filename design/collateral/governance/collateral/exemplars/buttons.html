<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="background:#FFFFFF">
<div class="card">
  <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center">
    <button style="all:unset; cursor:pointer; padding:11px 20px; background:#149DFF; color:#fff; font:600 14px/1 Inter; border-radius:8px">Let's Talk →</button>
    <button style="all:unset; cursor:pointer; padding:11px 20px; background:#0A82EB; color:#fff; font:600 14px/1 Inter; border-radius:8px">Hover / Press</button>
    <button style="all:unset; cursor:pointer; padding:11px 20px; background:#020B1B; color:#fff; font:600 14px/1 Inter; border-radius:8px">Book Your 1:1 Call →</button>
  </div>
  <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:center">
    <button style="all:unset; cursor:pointer; padding:11px 20px; background:transparent; color:#020B1B; font:600 14px/1 Inter; border-radius:8px; border:1px solid #DEDEDE">Secondary (ghost)</button>
    <button style="all:unset; cursor:pointer; padding:11px 4px; background:transparent; color:#0A82EB; font:600 14px/1 Inter">Tertiary link →</button>
  </div>
  <div style="font:400 12px/1.5 Inter; color:#616161">Primary &amp; CTA = electric (#149DFF → #0A82EB hover). Navy for secondary emphasis; ghost for tertiary. No flat shadow — buttons are flat.</div>
</div>
</body></html>
