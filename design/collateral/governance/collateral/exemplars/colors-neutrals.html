<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row">
    <div class="tile"><div class="swatch" style="background:var(--cr-paper)"></div><div class="name">Paper</div><div class="meta">#FFFFFF · page surface</div></div>
    <div class="tile"><div class="swatch" style="background:var(--cr-line)"></div><div class="name">Line</div><div class="meta">#DEDEDE · hairline</div></div>
    <div class="tile"><div class="swatch" style="background:var(--cr-stone)"></div><div class="name">Stone</div><div class="meta">#9A9A9A · faint text</div></div>
    <div class="tile"><div class="swatch" style="background:var(--cr-graphite)"></div><div class="name">Graphite</div><div class="meta">#616161 · secondary text</div></div>
    <div class="tile"><div class="swatch" style="background:var(--cr-charcoal)"></div><div class="name">Charcoal</div><div class="meta">#292929 · primary text</div></div>
    <div class="tile"><div class="swatch dark" style="background:var(--cr-ink)"></div><div class="name">Ink (navy)</div><div class="meta">#020B1B · dark surface</div></div>
  </div>
  <div class="meta" style="font:400 10px/1.4 var(--font-mono); color:var(--cr-graphite)">Gray ramp (stone / graphite / charcoal) is TEXT-only. No cream / beige; dark surfaces use navy, not slate or charcoal.</div>
</div>
</body></html>
