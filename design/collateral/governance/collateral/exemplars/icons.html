<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script></head>
<body style="background:#FFFFFF">
<div class="card">
  <div style="display:flex; gap:16px; flex-wrap:wrap">
    <div style="display:flex; align-items:center; gap:10px"><div style="width:32px; height:32px; border-radius:999px; background:var(--cr-tone-periwinkle); display:grid; place-items:center"><i data-lucide="bug-off" style="width:16px; height:16px; color:var(--cr-tone-periwinkle-accent)"></i></div><div style="font:500 12px/1.3 Inter; color:#292929">Risk</div></div>
    <div style="display:flex; align-items:center; gap:10px"><div style="width:32px; height:32px; border-radius:999px; background:var(--cr-tone-periwinkle); display:grid; place-items:center"><i data-lucide="trending-up" style="width:16px; height:16px; color:var(--cr-tone-periwinkle-accent)"></i></div><div style="font:500 12px/1.3 Inter; color:#292929">Revenue</div></div>
    <div style="display:flex; align-items:center; gap:10px"><div style="width:32px; height:32px; border-radius:999px; background:var(--cr-tone-periwinkle); display:grid; place-items:center"><i data-lucide="banknote-arrow-down" style="width:16px; height:16px; color:var(--cr-tone-periwinkle-accent)"></i></div><div style="font:500 12px/1.3 Inter; color:#292929">Cost</div></div>
    <div style="display:flex; align-items:center; gap:10px"><div style="width:32px; height:32px; border-radius:999px; background:var(--cr-tone-periwinkle); display:grid; place-items:center"><i data-lucide="layers" style="width:16px; height:16px; color:var(--cr-tone-periwinkle-accent)"></i></div><div style="font:500 12px/1.3 Inter; color:#292929">Stack</div></div>
    <div style="display:flex; align-items:center; gap:10px"><div style="width:32px; height:32px; border-radius:999px; background:var(--cr-tone-periwinkle); display:grid; place-items:center"><i data-lucide="sparkles" style="width:16px; height:16px; color:var(--cr-tone-periwinkle-accent)"></i></div><div style="font:500 12px/1.3 Inter; color:#292929">Agents</div></div>
    <div style="display:flex; align-items:center; gap:10px"><div style="width:32px; height:32px; border-radius:999px; background:var(--cr-tone-periwinkle); display:grid; place-items:center"><i data-lucide="hand-coins" style="width:16px; height:16px; color:var(--cr-tone-periwinkle-accent)"></i></div><div style="font:500 12px/1.3 Inter; color:#292929">Scale</div></div>
    <div style="display:flex; align-items:center; gap:10px"><div style="width:32px; height:32px; border-radius:999px; background:var(--cr-tone-periwinkle); display:grid; place-items:center"><i data-lucide="wallet" style="width:16px; height:16px; color:var(--cr-tone-periwinkle-accent)"></i></div><div style="font:500 12px/1.3 Inter; color:#292929">ROI</div></div>
    <div style="display:flex; align-items:center; gap:10px"><div style="width:32px; height:32px; border-radius:999px; background:var(--cr-tone-periwinkle); display:grid; place-items:center"><i data-lucide="link" style="width:16px; height:16px; color:var(--cr-tone-periwinkle-accent)"></i></div><div style="font:500 12px/1.3 Inter; color:#292929">Integrate</div></div>
  </div>
  <div style="font:400 11px/1.5 Inter; color:#616161">Lucide via CDN · 16px · accent #4F57C4 inside a circular periwinkle tonal chip. Icons carry the tonal accent — never the primary text colour, never a number.</div>
</div>
<script>lucide.createIcons();</script>
</body></html>
