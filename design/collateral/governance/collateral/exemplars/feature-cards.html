<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="background:#FFFFFF">
<div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:12px">
  <div style="background:#fff; border:1px solid var(--cr-line); border-radius:8px; padding:16px; display:flex; flex-direction:column; gap:8px">
    <div style="width:32px; height:32px; border-radius:999px; background:var(--cr-tone-periwinkle); display:grid; place-items:center"><div style="width:14px; height:14px; border:1.5px solid var(--cr-tone-periwinkle-accent); border-radius:3px"></div></div>
    <div style="font:500 15px/1.3 Manrope; color:#292929; letter-spacing:-.02em">Risk Elimination</div>
    <div style="font:400 11px/1.5 Inter; color:#616161">Move from sampling 5% of calls to auditing 100%.</div>
  </div>
  <div style="background:#fff; border:1px solid var(--cr-line); border-radius:8px; padding:16px; display:flex; flex-direction:column; gap:8px">
    <div style="width:32px; height:32px; border-radius:999px; background:var(--cr-tone-periwinkle); display:grid; place-items:center"><div style="width:12px; height:12px; border:1.5px solid var(--cr-tone-periwinkle-accent); border-radius:999px"></div></div>
    <div style="font:500 15px/1.3 Manrope; color:#292929; letter-spacing:-.02em">Revenue Acceleration</div>
    <div style="font:400 11px/1.5 Inter; color:#616161">Identify the exact techniques your top performers use.</div>
  </div>
  <div style="background:#fff; border:1px solid var(--cr-line); border-radius:8px; padding:16px; display:flex; flex-direction:column; gap:8px">
    <div style="width:32px; height:32px; border-radius:999px; background:var(--cr-tone-periwinkle); display:grid; place-items:center"><div style="width:14px; height:10px; border:1.5px solid var(--cr-tone-periwinkle-accent); border-radius:2px"></div></div>
    <div style="font:500 15px/1.3 Manrope; color:#292929; letter-spacing:-.02em">Cost Reduction</div>
    <div style="font:400 11px/1.5 Inter; color:#616161">Slash QA costs by 92%. 10K calls cost the same as 100K.</div>
  </div>
</div>
</body></html>
