<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="background:#FFFFFF">
<style>
  .row3 { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .feat { display:flex; flex-direction:column; gap:8px; }
  .chip { width:32px; height:32px; border-radius:999px; background:var(--cr-tone-periwinkle); display:flex; align-items:center; justify-content:center; }
  .chip svg { width:16px; height:16px; stroke:var(--cr-tone-periwinkle-accent); stroke-width:1.75; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .ftitle { font:500 14px/1.3 Manrope; letter-spacing:-.02em; color:#292929; }
  .fbody { font:400 11px/1.5 Inter; color:#616161; }
</style>
<div class="card">
  <div class="row3">
    <div class="feat"><div class="chip"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5 5l14 14"/></svg></div><div class="ftitle">Risk Elimination</div><div class="fbody">Move from sampling 5% of calls to auditing 100%.</div></div>
    <div class="feat"><div class="chip"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg></div><div class="ftitle">Revenue Acceleration</div><div class="fbody">Identify the exact techniques top performers use.</div></div>
    <div class="feat"><div class="chip"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M7 10h10"/><path d="M12 19v-3"/></svg></div><div class="ftitle">Cost Reduction</div><div class="fbody">Slash QA costs by 92%. Same cost at 10× scale.</div></div>
  </div>
</div>
</body></html>
